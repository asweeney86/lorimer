[package]
name = "lorimer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Fast, native, open source disk usage visualizer"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
crossbeam-channel = "0.5"
directories = "6.0"
lorimer-core = { path = "../core" }
iced = { version = "0.14.0", features = ["canvas", "tokio"] }
rfd = "0.17"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[dev-dependencies]
tempfile = "3.15"
