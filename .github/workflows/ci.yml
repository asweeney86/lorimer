name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  homebrew:
    name: Homebrew cask
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render and lint the cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          # brew style applies the cask rules only to files inside a tap.
          brew tap-new --no-git local/lorimer-ci
          tap="$(brew --repository local/lorimer-ci)"
          mkdir -p "$tap/Casks"
          echo placeholder > "$RUNNER_TEMP/Lorimer.zip"
          scripts/render-cask.sh 0.0.0 "$RUNNER_TEMP/Lorimer.zip" > "$tap/Casks/lorimer.rb"
          cat "$tap/Casks/lorimer.rb"
          brew style local/lorimer-ci
